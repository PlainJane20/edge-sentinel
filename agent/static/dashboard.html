<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edge Sentinel dashboard</title>
<style>
  :root {
    --bg: #f5f7fa; --card: #ffffff; --ink: #0f172a; --muted: #64748b; --line: #e2e8f0;
    --accent: #2a78d6;
    --ignore: #94a3b8; --log: #38bdf8; --alert: #fbbf24; --shutdown: #ef4444;
    --ok: #16a34a; --bad: #dc2626;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
    padding: 16px 28px; background: var(--card); border-bottom: 1px solid var(--line); }
  h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
  h1 small { color: var(--muted); font-weight: 400; margin-left: 8px; font-size: 13px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600; border: 1px solid var(--line); background: #f8fafc; color: var(--muted); }
  .badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .badge.ok { color: var(--ok); background: #f0fdf4; border-color: #bbf7d0; } .badge.ok .dot { background: var(--ok); }
  .badge.bad { color: var(--bad); background: #fef2f2; border-color: #fecaca; } .badge.bad .dot { background: var(--bad); }
  .badge.warn { color: #b45309; background: #fffbeb; border-color: #fde68a; } .badge.warn .dot { background: #f59e0b; }
  input[type=password] { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; width: 210px;
    font: inherit; background: #fff; }
  input:focus { outline: 2px solid #bfdbfe; border-color: var(--accent); }
  button { padding: 6px 12px; border: 0; border-radius: 8px; background: var(--accent); color: #fff;
    font: inherit; font-weight: 600; cursor: pointer; }
  button.ghost { background: #eef2f7; color: var(--ink); }
  main { max-width: 1180px; margin: 0 auto; padding: 22px 28px 40px; display: grid; gap: 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px;
    box-shadow: 0 1px 2px rgba(15,23,42,.04); }
  .card h2 { margin: 0 0 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .counts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
  .count { border-left: 4px solid var(--c); padding: 4px 0 4px 12px; }
  .count b { display: block; font-size: 26px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .count span { color: var(--muted); text-transform: capitalize; }
  #chart { width: 100%; height: 300px; display: block; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; color: var(--muted); font-size: 12px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; background: var(--c); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  .pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-weight: 600; font-size: 12px;
    color: #0f172a; background: var(--c); }
  .pill.shutdown { color: #fff; }
  .esc { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; padding: 1px 8px; border-radius: 999px;
    font-size: 12px; font-weight: 600; }
  .muted { color: var(--muted); }
  #msg { color: var(--bad); font-size: 13px; }
  #msg:empty { display: none; }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding-bottom: 24px; }
</style>
</head>
<body>
<header>
  <h1>Edge Sentinel <small>live decisions</small></h1>
  <div class="bar">
    <span id="authBadge" class="badge"><span class="dot"></span><span>auth: ...</span></span>
    <span id="chainBadge" class="badge"><span class="dot"></span><span>audit chain: ...</span></span>
    <input id="token" type="password" placeholder="Operator token (if auth is on)" autocomplete="off" aria-label="Operator token">
    <button id="save">Use token</button>
    <button id="clear" class="ghost">Clear</button>
  </div>
</header>
<main>
  <div id="msg"></div>
  <section class="card"><h2>Decisions by action</h2><div class="counts" id="counts"></div></section>
  <section class="card">
    <h2>Temperature and decisions</h2>
    <svg id="chart" viewBox="0 0 1100 300" preserveAspectRatio="none" role="img" aria-label="Temperature line chart with decision markers"></svg>
    <div class="legend" id="legend"></div>
  </section>
  <section class="card">
    <h2>Latest decisions</h2>
    <table>
      <thead><tr><th>Time</th><th>Device</th><th>Temp</th><th>Action</th><th>Source</th><th>Confidence</th><th></th></tr></thead>
      <tbody id="rows"><tr><td colspan="7" class="muted">Waiting for data...</td></tr></tbody>
    </table>
  </section>
</main>
<footer>Polls every 3 s. The token is kept in this tab only (sessionStorage) and sent as a Bearer header.</footer>
<script>
(function () {
  "use strict";
  var COLORS = { ignore: "#94a3b8", log: "#38bdf8", alert: "#fbbf24", shutdown: "#ef4444" };
  var ACTIONS = ["ignore", "log", "alert", "shutdown"];
  var NS = "http://www.w3.org/2000/svg";
  var $ = function (id) { return document.getElementById(id); };
  var token = "";
  try { token = sessionStorage.getItem("edgeToken") || ""; } catch (e) {}
  $("token").value = token;

  function headers() { return token ? { Authorization: "Bearer " + token } : {}; }
  function setBadge(el, cls, text) {
    el.className = "badge " + cls; el.lastChild.textContent = text;
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function el(name, attrs, text) {
    var n = document.createElementNS(NS, name);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }

  function renderCounts(data) {
    var c = { ignore: 0, log: 0, alert: 0, shutdown: 0 };
    data.forEach(function (d) { c[d.decision.action] = (c[d.decision.action] || 0) + 1; });
    $("counts").innerHTML = ACTIONS.map(function (a) {
      return '<div class="count" style="--c:' + COLORS[a] + '"><b>' + c[a] + "</b><span>" + a + "</span></div>";
    }).join("");
  }

  function renderChart(data) {
    var svg = $("chart"); while (svg.firstChild) svg.removeChild(svg.firstChild);
    var W = 1100, H = 300, L = 46, R = 14, T = 14, B = 26;
    if (!data.length) {
      svg.appendChild(el("text", { x: W / 2, y: H / 2, "text-anchor": "middle", fill: "#94a3b8", "font-size": 16 }, "No readings yet"));
      return;
    }
    var temps = data.map(function (d) { return d.reading.temperature_c; });
    var lo = Math.min.apply(null, temps.concat([40])), hi = Math.max.apply(null, temps.concat([95]));
    lo = Math.floor(lo / 10) * 10; hi = Math.ceil(hi / 10) * 10;
    var n = data.length;
    var x = function (i) { return L + (n === 1 ? 0.5 : i / (n - 1)) * (W - L - R); };
    var y = function (v) { return T + (1 - (v - lo) / (hi - lo)) * (H - T - B); };
    for (var g = lo; g <= hi; g += 10) {
      svg.appendChild(el("line", { x1: L, x2: W - R, y1: y(g), y2: y(g), stroke: "#e2e8f0", "stroke-width": 1 }));
      svg.appendChild(el("text", { x: L - 8, y: y(g) + 4, "text-anchor": "end", fill: "#64748b", "font-size": 11 }, g + "°"));
    }
    svg.appendChild(el("text", { x: L, y: H - 6, fill: "#64748b", "font-size": 11 }, "oldest"));
    svg.appendChild(el("text", { x: W - R, y: H - 6, "text-anchor": "end", fill: "#64748b", "font-size": 11 }, "latest (" + n + " readings)"));
    var pts = temps.map(function (t, i) { return x(i).toFixed(1) + "," + y(t).toFixed(1); }).join(" ");
    svg.appendChild(el("polyline", { points: pts, fill: "none", stroke: "#334155", "stroke-width": 1.6, "stroke-linejoin": "round" }));
    data.forEach(function (d, i) {
      var c = el("circle", { cx: x(i), cy: y(temps[i]), r: 4.5, fill: COLORS[d.decision.action] || "#334155",
        stroke: "#fff", "stroke-width": 1.2 });
      c.appendChild(el("title", {}, temps[i] + "°C, " + d.decision.action + " (" + d.decision.source + ")"));
      svg.appendChild(c);
    });
  }

  function fmtTime(ts) { return new Date(ts * 1000).toLocaleTimeString(); }
  function renderRows(data) {
    var rows = data.slice(-12).reverse();
    if (!rows.length) return;
    $("rows").innerHTML = rows.map(function (d) {
      var dec = d.decision, conf = dec.confidence == null ? "—" : Number(dec.confidence).toFixed(2);
      return "<tr><td>" + esc(fmtTime(d.ts)) + "</td><td>" + esc(d.reading.device_id) + "</td><td>" +
        esc(d.reading.temperature_c) + "°C</td><td><span class=\"pill " + esc(dec.action) + "\" style=\"--c:" +
        (COLORS[dec.action] || "#cbd5e1") + "\">" + esc(dec.action) + "</span></td><td>" + esc(dec.source) +
        "</td><td>" + conf + "</td><td>" + (dec.escalated ? '<span class="esc">escalated</span>' : "") + "</td></tr>";
    }).join("");
  }

  function authFail(status) {
    $("msg").textContent = status === 401 ? "Operator token required or not accepted. Enter it above."
      : "This token cannot read operator data (HTTP " + status + ").";
  }

  function getJSON(path) {
    return fetch(path, { headers: headers(), cache: "no-store" }).then(function (r) {
      if (!r.ok) { var e = new Error("HTTP " + r.status); e.status = r.status; throw e; }
      return r.json();
    });
  }

  function tick() {
    getJSON("/healthz").then(function (h) {
      setBadge($("authBadge"), h.auth ? "ok" : "warn", h.auth ? "auth: on" : "auth: OFF (demo)");
    }).catch(function () { setBadge($("authBadge"), "bad", "gateway unreachable"); });

    getJSON("/history?limit=200").then(function (data) {
      $("msg").textContent = "";
      renderCounts(data); renderChart(data); renderRows(data);
    }).catch(function (e) {
      if (e.status === 401 || e.status === 403) authFail(e.status);
      else $("msg").textContent = "Could not load /history: " + e.message;
    });

    getJSON("/audit/verify").then(function (v) {
      if (v.ok) setBadge($("chainBadge"), "ok", "audit chain: verified");
      else setBadge($("chainBadge"), "bad", "audit chain: BROKEN at record " + v.first_bad_index);
    }).catch(function (e) {
      setBadge($("chainBadge"), "warn", e.status ? "audit chain: needs token" : "audit chain: unavailable");
    });
  }

  $("legend").innerHTML = ACTIONS.map(function (a) {
    return '<span style="--c:' + COLORS[a] + '"><i></i>' + a + "</span>";
  }).join("");
  $("save").onclick = function () {
    token = $("token").value.trim();
    try { sessionStorage.setItem("edgeToken", token); } catch (e) {}
    tick();
  };
  $("clear").onclick = function () {
    token = ""; $("token").value = "";
    try { sessionStorage.removeItem("edgeToken"); } catch (e) {}
    tick();
  };
  $("token").addEventListener("keydown", function (e) { if (e.key === "Enter") $("save").onclick(); });
  tick(); setInterval(tick, 3000);
})();
</script>
</body>
</html>
