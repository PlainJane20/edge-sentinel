<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">How Edge Sentinel works</title>
  <desc id="d">An ESP32 sends readings to a gateway. A cascade decides: a hard limit first, then Jev, then an LLM only if Jev is unsure. A policy and audit layer governs the action, and the decision returns to the device.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0f766e"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="640" rx="20" fill="#f8fafc"/>

  <text x="600" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">How Edge Sentinel works</text>
  <text x="600" y="76" text-anchor="middle" font-size="15" fill="#475569">A sensor reading becomes a governed decision, using the cheapest layer that is confident enough</text>

  <!-- 1 ESP32 -->
  <g filter="url(#sh)">
    <rect x="40" y="160" width="210" height="140" rx="14" fill="#ffffff" stroke="#14b8a6" stroke-width="2"/>
  </g>
  <text x="145" y="195" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e" letter-spacing="1.5">1  THE DEVICE</text>
  <text x="145" y="225" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">ESP32</text>
  <text x="145" y="251" text-anchor="middle" font-size="13" fill="#334155">measures temperature,</text>
  <text x="145" y="270" text-anchor="middle" font-size="13" fill="#334155">Wi-Fi signal, memory</text>
  <text x="145" y="290" text-anchor="middle" font-size="12" font-style="italic" fill="#64748b">like a nerve ending</text>

  <!-- arrow 1 -->
  <path d="M254 230H290" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <!-- 2 Gateway -->
  <g filter="url(#sh)">
    <rect x="294" y="160" width="210" height="140" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  </g>
  <text x="399" y="195" text-anchor="middle" font-size="12" font-weight="700" fill="#475569" letter-spacing="1.5">2  THE GATEWAY</text>
  <text x="399" y="225" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Your laptop</text>
  <text x="399" y="251" text-anchor="middle" font-size="13" fill="#334155">receives each reading and</text>
  <text x="399" y="270" text-anchor="middle" font-size="13" fill="#334155">asks: what should we do?</text>

  <!-- arrow 2 -->
  <path d="M508 230H544" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <!-- 3 Cascade -->
  <g filter="url(#sh)">
    <rect x="548" y="100" width="372" height="360" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/>
  </g>
  <text x="734" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e" letter-spacing="1">3  THE DECISION: CHEAPEST LAYER FIRST</text>

  <rect x="568" y="148" width="332" height="86" rx="10" fill="#fef2f2" stroke="#ef4444"/>
  <text x="584" y="174" font-size="14" font-weight="700" fill="#991b1b">A. Hard safety limit</text>
  <text x="584" y="196" font-size="13" fill="#334155">90 °C or higher: shut down.</text>
  <text x="584" y="215" font-size="13" fill="#334155">No AI involved. Like a reflex.</text>

  <rect x="568" y="246" width="332" height="96" rx="10" fill="#f0fdfa" stroke="#14b8a6"/>
  <text x="584" y="272" font-size="14" font-weight="700" fill="#0f766e">B. Jev: fast AI</text>
  <text x="584" y="294" font-size="13" fill="#334155">Picks one action and says how sure it is.</text>
  <text x="584" y="313" font-size="13" fill="#334155">Sure enough: done.  Unsure: go to C.</text>
  <text x="584" y="332" font-size="12" font-weight="600" fill="#0f766e">about 117 ms median (measured)</text>

  <rect x="568" y="354" width="332" height="86" rx="10" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="584" y="380" font-size="14" font-weight="700" fill="#5b21b6">C. LLM: slower, only if needed</text>
  <text x="584" y="402" font-size="13" fill="#334155">Careful thinking for unusual cases.</text>
  <text x="584" y="421" font-size="12" font-weight="600" fill="#5b21b6">about 627 ms median (measured)</text>

  <!-- arrow 3 -->
  <path d="M924 230H960" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <!-- 4 Policy -->
  <g filter="url(#sh)">
    <rect x="964" y="160" width="200" height="140" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <text x="1064" y="195" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309" letter-spacing="1.5">4  THE RULES</text>
  <text x="1064" y="225" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Policy + audit</text>
  <text x="1064" y="251" text-anchor="middle" font-size="13" fill="#334155">risky actions need approval</text>
  <text x="1064" y="270" text-anchor="middle" font-size="13" fill="#334155">every decision is logged</text>
  <text x="1064" y="289" text-anchor="middle" font-size="12" fill="#334155">in a tamper-evident chain</text>

  <!-- return path -->
  <path d="M1064 304V520H145V304" stroke="#0f766e" stroke-width="2.5" fill="none" stroke-dasharray="7 6" marker-end="url(#arr)"/>
  <rect x="320" y="504" width="560" height="32" rx="16" fill="#f8fafc"/>
  <text x="600" y="526" text-anchor="middle" font-size="14" font-weight="600" fill="#0f766e">5  The decision goes back to the device, which acts (alert, switch off)</text>

  <!-- analogy footer -->
  <text x="600" y="578" text-anchor="middle" font-size="13" fill="#475569">Think of it as:  <tspan font-weight="700" fill="#991b1b">reflex</tspan> (A)  ·  <tspan font-weight="700" fill="#0f766e">quick judgment</tspan> (B)  ·  <tspan font-weight="700" fill="#5b21b6">careful thought</tspan> (C)</text>
  <text x="600" y="606" text-anchor="middle" font-size="12" fill="#64748b">Latencies: 48 sensor readings, one machine, sequential calls over the internet. Not yet run on a real ESP32.</text>
</svg>
