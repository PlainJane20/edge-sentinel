<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Edge Sentinel</title>
  <desc id="description">Governed agents that act on the physical world: ESP32 telemetry, fast typed decisions, policy-gated actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07151f"/>
      <stop offset="0.56" stop-color="#0f3a3a"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity=".7"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#5eead4" stop-opacity=".25"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#030b13" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <circle cx="1040" cy="60" r="230" fill="url(#glow)"/>
  <g opacity=".2" fill="none" stroke="#5eead4" stroke-width="1.2">
    <path d="M760 230h70v-60h60v40h70v-90h70v50h90"/>
    <g fill="#5eead4" stroke="none"><circle cx="760" cy="230" r="5"/><circle cx="890" cy="210" r="5"/><circle cx="1020" cy="120" r="5"/><circle cx="1180" cy="170" r="5"/></g>
  </g>
  <g transform="translate(74 68)" filter="url(#shadow)">
    <rect width="88" height="88" rx="22" fill="#0b2c2f" stroke="#5eead4" stroke-opacity=".6"/>
    <g fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="28" y="28" width="32" height="32" rx="4"/>
      <path d="M36 28v-9M44 28v-9M52 28v-9M36 60v9M44 60v9M52 60v9M28 36h-9M28 44h-9M28 52h-9M60 36h9M60 44h9M60 52h9"/>
      <circle cx="44" cy="44" r="5"/>
    </g>
  </g>
  <text x="190" y="118" fill="#f0fdfa" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="56" font-weight="700">Edge Sentinel</text>
  <text x="190" y="162" fill="#99f6e4" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="24">Governed agents that act on the physical world</text>
  <text x="74" y="250" fill="#ccfbf1" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="20" opacity=".9">ESP32 telemetry  ·  Jev-first decision cascade  ·  policy-gated actions  ·  tamper-evident audit</text>
</svg>
